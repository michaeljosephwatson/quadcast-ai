name: Pylint

on:
  push:
    branches: [main, develop]
    paths:
      - '**.py'
      - '**/requirements.txt'
  pull_request:
    branches: [main, develop]

jobs:
  pylint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        for req_file in requirements.txt add_podcast/requirements.txt dashboard/requirements.txt; do
          [ -f "$req_file" ] && pip install -r "$req_file"
        done

    - name: Run pylint
      run: |
        pylint --fail-under=8 $(find . -type f -name "*.py" | grep -v __pycache__ | tr '\n' ' ')
